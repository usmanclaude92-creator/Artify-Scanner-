name: Build APK

permissions:
  contents: write

on:
  push:
    branches: [ccr-193497e9-2e0w38, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Use the fixed debug keystore (keeps the SHA-1 stable for Google sign-in)
        run: cp ci/debug.keystore debug.keystore
      - name: Add google-services.json from secret (enables the AI Assistant)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret set; building without AI Assistant config."
          fi
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: artify-scanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish UI screenshots to branch ci-screenshots
        if: always()
        run: |
          if ls app/build/screenshots/* >/dev/null 2>&1; then
            mkdir -p /tmp/shots && cp app/build/screenshots/* /tmp/shots/
            git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
            git checkout --orphan ci-screenshots
            git rm -rf . -q
            git clean -fdxq
            cp /tmp/shots/* .
            git add . && git commit -q -m "UI screenshots for ${GITHUB_SHA}"
            git push -f origin ci-screenshots
            git checkout -f ${GITHUB_SHA}
          fi
